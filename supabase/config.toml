# Edge function configuration.
#
# Every function below authenticates the caller itself: the admin/account
# functions validate the Authorization bearer token via auth.getUser (and, where
# relevant, check the caller's admin role with has_role), and the reminder jobs
# run on a schedule with the service role. The platform-level JWT gate must
# therefore be turned OFF. With verify_jwt = true (the Supabase default when a
# function isn't declared here) the gateway rejects the browser's CORS preflight
# -- an OPTIONS request that carries no Authorization header -- before it ever
# reaches the function. In the client that surfaces as the fetch-level error
# "Failed to send a request to the Edge Function", e.g. when sending an app
# update from the admin "App Updates & Notifications" screen.
#
# verify_jwt = false does not weaken security here: each function still requires
# a valid bearer token (and admin role) and rejects anything else itself.

[functions.send-app-update]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.admin-list-users]
verify_jwt = false

[functions.admin-delete-user]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.event-reminders]
verify_jwt = false

[functions.special-reminders]
verify_jwt = false

# Auth email configuration.
#
# Applied when the Supabase config is pushed. The same values must be set in the
# dashboard (Authentication -> Emails) for a project whose auth settings are
# managed there -- see PASSWORD_RESET_SETUP.md. The app enforces the 15-minute
# window itself as well, so the reset screen behaves correctly either way.
[auth.email]
# Emailed codes and links (password recovery, confirmations) expire after 15
# minutes.
otp_expiry = 900
# At most one auth email per address per minute; the resend buttons in the app
# count this down instead of letting the request fail.
max_frequency = "60s"
# A new account is not usable until the six-digit code we email has been typed
# back into the app. The address is the only way we can reset a password or
# reach someone about their account, so it has to be a real inbox they own.
enable_confirmations = true
otp_length = 6
# Changing your email confirms at the NEW address only. Double confirmation
# would email the old address too -- which is exactly the address someone is
# trying to escape when they mistyped it at signup, and would lock them out of
# ever correcting it.
double_confirm_changes = false

[auth.email.template.recovery]
subject = "Reset your Hello Hoedspruit password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Your Hello Hoedspruit verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Hello Hoedspruit email"
content_path = "./supabase/templates/email_change.html"
