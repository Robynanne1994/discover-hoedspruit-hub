project_id = "dgkfsavtyclwkramearr"

# Edge function configuration.
#
# Every function below authenticates the caller itself: the admin/account
# functions validate the Authorization bearer token via auth.getUser (and, where
# relevant, check the caller's admin role with has_role), and the reminder jobs
# run on a schedule with the service role. The platform-level JWT gate must
# therefore be turned OFF. With verify_jwt = true (the Supabase default when a
# function isn't declared here) the gateway rejects the browser's CORS preflight
# -- an OPTIONS request that carries no Authorization header -- before it ever
# reaches the function. In the client that surfaces as the fetch-level error
# "Failed to send a request to the Edge Function", e.g. when sending an app
# update from the admin "App Updates & Notifications" screen.
#
# verify_jwt = false does not weaken security here: each function still requires
# a valid bearer token (and admin role) and rejects anything else itself.

[functions.send-app-update]
verify_jwt = false

[functions.send-push]
verify_jwt = false

[functions.admin-list-users]
verify_jwt = false

[functions.admin-delete-user]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.event-reminders]
verify_jwt = false

[functions.special-reminders]
verify_jwt = false

# Nightly Google ratings refresh. Called by pg_cron with the service role key,
# or manually by an admin; the function checks the bearer token itself and
# rejects anonymous callers, so the platform gate stays off.
[functions.refresh-google-ratings]
verify_jwt = false


[functions.process-email-queue]
verify_jwt = true

# The auth email sender. Supabase calls this itself, signing the request with
# the Standard Webhooks secret in SEND_EMAIL_HOOK_SECRET rather than with a JWT,
# so the platform JWT gate has to be off or every call is rejected before the
# function sees it. The function verifies that signature itself and refuses any
# request it cannot verify -- see the top of its index.ts.
[functions.send-auth-email]
verify_jwt = false

# The app's own six-digit verification codes (signup, and changing your email).
#
# Two of its actions are deliberately callable without a session -- creating an
# account and redeeming the code that activates it both happen before there is
# one -- so the platform JWT gate has to be off. The other actions read the
# bearer token themselves via auth.getUser and refuse anything else, and every
# state change is behind a code that was only ever emailed to the address being
# proved.
[functions.account-email]
verify_jwt = false

# Auth email configuration.
#
# Applied when the Supabase config is pushed. The same values must be set in the
# dashboard (Authentication -> Emails) for a project whose auth settings are
# managed there -- see PASSWORD_RESET_SETUP.md. The app enforces the 15-minute
# window itself as well, so the reset screen behaves correctly either way.
[auth.email]
# Emailed codes and links (password recovery, and anything still going through
# Supabase's own sender) expire after 30 minutes. Fifteen was too short to
# survive the ordinary case of reading the email on another device: the app's
# own codes (supabase/functions/account-email) use the same window, and
# VERIFICATION_CODE_TTL_MINUTES / RESET_LINK_TTL_MINUTES mirror it.
otp_expiry = 1800
# At most one auth email per address per minute; the resend buttons in the app
# count this down instead of letting the request fail.
max_frequency = "60s"
# A new account is not usable until the six-digit code we email has been typed
# back into the app. The address is the only way we can reset a password or
# reach someone about their account, so it has to be a real inbox they own.
#
# This must stay ON. It is what stops an unverified account being signed in to:
# the app creates the account unconfirmed, and Supabase refuses its password
# until the code from account-email has been redeemed. With this off, an
# unverified address would be a working account.
enable_confirmations = true
otp_length = 6
# Changing your email confirms at the NEW address only. Double confirmation
# would email the old address too -- which is exactly the address someone is
# trying to escape when they mistyped it at signup, and would lock them out of
# ever correcting it.
double_confirm_changes = false

# Hand every auth email to the send-auth-email function instead of letting the
# platform's built-in sender deliver it.
#
# This is what stops the codes disappearing. The built-in sender is a shared,
# rate-limited development convenience on a domain hellohoedspruit.co has never
# authorised, so its mail is throttled to a handful an hour and lands under a
# spam warning -- which also disables every link in the body. The hook moves
# sending onto our own domain and renders the templates from this repo, so the
# six-digit code is always in the email the app asks for it from.
#
# The [auth.email.template.*] entries below stay as a safety net: they are what
# goes out if the hook is ever disabled.
[auth.hook.send_email]
enabled = true
uri = "https://dgkfsavtyclwkramearr.supabase.co/functions/v1/send-auth-email"
# Read from the environment -- the value is a shared secret and does not belong
# in a committed file. Set SEND_EMAIL_HOOK_SECRET in the Supabase dashboard
# (Edge Functions -> Secrets) and locally in supabase/.env.
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[auth.email.template.recovery]
subject = "Reset your Hello Hoedspruit password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Your Hello Hoedspruit verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Hello Hoedspruit email"
content_path = "./supabase/templates/email_change.html"
